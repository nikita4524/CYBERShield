  <text x="267" y="352" text-anchor="middle" font-size="8.5" fill="#92400e">34k Domain Blocklist</text>
  <text x="267" y="364" text-anchor="middle" font-size="8" fill="#b45309">Shannon Entropy</text>
  <text x="267" y="376" text-anchor="middle" font-size="8" fill="#b45309">India bank abuse check</text>
  <text x="267" y="388" text-anchor="middle" font-size="8" fill="#b45309">Acc=93.3% (15 URLs)</text>

