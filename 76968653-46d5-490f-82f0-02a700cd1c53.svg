  <text x="117" y="340" text-anchor="middle" font-size="8.5" fill="#92400e">ML: LR + RF</text>
  <text x="117" y="352" text-anchor="middle" font-size="8.5" fill="#92400e">Ensemble (soft-vote)</text>
  <text x="117" y="364" text-anchor="middle" font-size="8" fill="#b45309">+ Urgency heuristics</text>
  <text x="117" y="376" text-anchor="middle" font-size="8" fill="#b45309">+ Sender analysis</text>
  <text x="117" y="388" text-anchor="middle" font-size="8" fill="#b45309">F1=0.75 (unseen)</text>

